<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:">
<title>Anni</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }

  #bubble {
    position: absolute; left: 50%; top: 14px;
    transform: translate(-50%, 6px) scale(.92);
    background: #fffaf3; color: #4a1a10;
    font: 700 max(11px, calc(14px * var(--s, 1)))/1.25 "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: 7px 12px; border-radius: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.28);
    opacity: 0; transition: opacity .18s, transform .18s;
    pointer-events: none; white-space: normal; text-align: center;
    width: max-content; max-width: calc(100% - 20px); box-sizing: border-box;
  }
  #bubble .rest { visibility: hidden; }

  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #fx .p {
    position: absolute; font: 800 18px "Segoe UI", system-ui, sans-serif;
    text-shadow: 0 1px 3px rgba(0,0,0,.45);
    animation: pfloat 1.6s ease-out both;
  }
  @keyframes pfloat {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% - 60px)) scale(1.15) rotate(var(--r, 0deg)); }
  }
  #bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; width: 11px; height: 11px;
    background: #fffaf3; transform: translateX(-50%) rotate(45deg); border-radius: 2px;
  }

  #hp {
    position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 5px; pointer-events: none; white-space: nowrap;
    font: 800 10px/1 ui-monospace, "DejaVu Sans Mono", "Courier New", monospace; color: #fff; text-shadow: 1px 1px 0 #2a0603;
    opacity: 0; transition: opacity .3s;
  }
  body.fight #hp { opacity: 1; }
  body.fight #bubble { top: 28px; }
  #hp span { width: 90px; height: 8px; border: 2px solid #2a0603; background: #5a1208; }
  #hp i { display: block; height: 100%; width: 100%; background: #5ad15a; transition: width .3s; }
  #hp.low i { background: #ffcc33; }

  #zzz { position: absolute; left: 58%; top: 34%; pointer-events: none; opacity: 0; transition: opacity .4s; }
  #zzz.show { opacity: 1; }
  #zzz span {
    position: absolute; font: 800 20px "Segoe UI", system-ui, sans-serif; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); opacity: 0;
    animation: zfloat 2.8s infinite ease-in;
  }
  #zzz span:nth-child(2) { animation-delay: .9s; font-size: 16px; }
  #zzz span:nth-child(3) { animation-delay: 1.8s; font-size: 24px; }
  @keyframes zfloat {
    0%   { transform: translate(0, 10px) scale(.6); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(26px, -48px) scale(1.15); opacity: 0; }
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="fx"></div>
  <div id="hp"><b>ANNI</b><span><i></i></span></div>
  <div id="bubble"></div>
  <div id="zzz"><span>z</span><span>z</span><span>Z</span></div>
  <script type="module" src="./anni.js"></script>
</body>
</html>
