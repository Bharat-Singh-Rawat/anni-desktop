<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
<title>Pixel Anni</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; }
  .mono { font-family: ui-monospace, "DejaVu Sans Mono", "Courier New", monospace; }

  #hp {
    position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 5px; pointer-events: none; white-space: nowrap;
    font: 800 10px/1 ui-monospace, "DejaVu Sans Mono", "Courier New", monospace; color: #fff; text-shadow: 1px 1px 0 #2a0603;
  }
  #hp span { width: 70px; height: 8px; border: 2px solid #2a0603; background: #5a1208; }
  #hp i { display: block; height: 100%; width: 100%; background: #5ad15a; transition: width .3s steps(5); }
  #hp.low i { background: #ffcc33; }

  #bubble {
    position: absolute; left: 50%; top: 26px; transform: translateX(-50%);
    background: #fff; color: #2a0603; text-transform: uppercase;
    font: 800 11px/1.25 ui-monospace, "DejaVu Sans Mono", "Courier New", monospace;
    padding: 5px 8px; border: 2px solid #2a0603; box-shadow: 3px 3px 0 #2a0603;
    width: max-content; max-width: calc(100% - 18px); box-sizing: border-box; text-align: center;
    opacity: 0; pointer-events: none;
  }
  #bubble.show { opacity: 1; }
  #bubble .rest { visibility: hidden; }

  .pop {
    position: absolute; pointer-events: none; white-space: nowrap;
    font: 900 17px ui-monospace, "DejaVu Sans Mono", "Courier New", monospace;
    color: #ffe14a; text-shadow: 2px 2px 0 #2a0603, -1px -1px 0 #2a0603;
    animation: pop .9s steps(7) both;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, 0) scale(.6); opacity: 1; }
    100% { transform: translate(-50%, -44px) scale(1.25); opacity: 0; }
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hp"><b>PIXEL ANNI</b><span><i></i></span></div>
  <div id="bubble"></div>
  <script type="module" src="./twin.js"></script>
</body>
</html>
